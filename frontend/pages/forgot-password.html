<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | AI Study Planner</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="../css/forgot-password.css">

</head>

<body>

<div class="container">

    <div class="forgot-card">

        <div class="logo">

            🤖 AI Study Planner

        </div>

        <h1>

            Forgot Password

        </h1>

        <p>

            Enter your registered email address to receive an OTP for resetting your password.

        </p>

        <form id="forgotForm">

            <div class="input-group">

                <label>

                    Email Address

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>

            <button
                type="submit"
                class="btn primary">

                <i class="fa-solid fa-paper-plane"></i>

                Send OTP

            </button>

        </form>

        <div class="divider">

            <span>

                OR

            </span>

        </div>

        <a
            href="login.html"
            class="back-link">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Login

        </a>

    </div>

</div>

        <!-- ========================================= -->
        <!-- OTP VERIFICATION -->
        <!-- ========================================= -->

        <div class="otp-section">

            <h2>

                Verify OTP

            </h2>

            <p>

                Enter the 6-digit OTP sent to your registered email.

            </p>

            <div class="otp-box">

                <input type="text" maxlength="1">

                <input type="text" maxlength="1">

                <input type="text" maxlength="1">

                <input type="text" maxlength="1">

                <input type="text" maxlength="1">

                <input type="text" maxlength="1">

            </div>

            <div class="otp-actions">

                <button class="btn secondary">

                    <i class="fa-solid fa-rotate-right"></i>

                    Resend OTP

                </button>

                <span id="timer">

                    OTP expires in 05:00

                </span>

            </div>

        </div>

        <!-- ========================================= -->
        <!-- RESET PASSWORD -->
        <!-- ========================================= -->

        <form id="resetForm">

            <div class="input-group">

                <label>

                    New Password

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required>

                    <i class="fa-solid fa-eye toggle-password"></i>

                </div>

            </div>

            <div class="input-group">

                <label>

                    Confirm Password

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required>

                    <i class="fa-solid fa-eye toggle-password"></i>

                </div>

            </div>

            <div class="password-strength">

                <div class="strength-bar">

                    <div class="strength-fill"></div>

                </div>

                <small>

                    Password Strength

                </small>

            </div>

            <button
                type="submit"
                class="btn primary">

                <i class="fa-solid fa-key"></i>

                Reset Password

            </button>

        </form>

    </div>

</div>

<script src="../js/forgot-password.js"></script>

</body>

</html>
